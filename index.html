const CL={antibiotic:"एंटीबायोटिक",antihistamine:"एंटीहिस्टामिन",antacid:"एंटासिड",analgesic:"दर्द निवारक",bronchodilator:"सांस की नली खोलने वाली",antihypertensive:"ब्लड प्रेशर की दवा",antidiabetic:"डायबिटीज़ की दवा",diuretic:"मूत्रवर्धक",corticosteroid:"स्टेरॉयड",antidepressant:"अवसादरोधी",other:"अन्य"};
const UN={strip:"पट्टी",bottle:"बोतल",tube:"ट्यूब",packet:"पैकेट",vial:"शीशी",box:"डिब्बा",sachet:"सैशे",jar:"जार",pen:"पेन",cartridge:"कार्ट्रिज"};
const IT={tablet:"गोलियों",tablets:"गोलियों",capsule:"कैप्सूल",capsules:"कैप्सूल",ml:"मि.ली.",gm:"ग्राम",g:"ग्राम",syrup:"सिरप",suspension:"सस्पेंशन",injection:"इंजेक्शन",cream:"क्रीम",gel:"जेल",drops:"बूंदों",solution:"घोल",inhaler:"इन्हेलर",ointment:"मरहम",lotion:"लोशन",powder:"पाउडर"};
const pk=s=>{if(lang!=="hi")return s;const m=String(s).match(/^(\w+) of (\d+(?:\.\d+)?)\s*(\w+)?\s*(.*)$/i),u=m&&UN[m[1].toLowerCase()];if(!u)return s;return `${m[2]} ${[m[3],m[4]].filter(Boolean).map(w=>IT[w.toLowerCase()]||w).join(" ")} की ${u}`};
const SAMPLE="Dr. A. Verma, City Clinic, Lucknow\nRx\n1. Tab Augmentin 625 - 1 tab twice daily x 5 days\n2. Tab Dolo 650 - SOS for fever\n3. Tab Pantop 40 - before breakfast\n4. Tab Cetzine - at night\n5. Tab Combiflam - after food if pain\n6. Tab Zenotrex 5 - once daily";
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let lang=CS.lang;
const t=(k,p={})=>(T[lang][k]??T.en[k]??k).replace(/\{(\w+)\}/g,(_,x)=>p[x]??"");
const rs=n=>"₹"+Number(n).toLocaleString("en-IN",{maximumFractionDigits:2});
const cls=c=>lang==="hi"?(CL[Object.keys(CL).find(k=>String(c).toLowerCase().startsWith(k))]||c):c;
let view={k:"empty"},note=null,imgFile=null;
function setNote(k,p){note={k,p};const n=$("ocrNote");n.hidden=false;n.textContent=t(k,p)}
function flag(f){const o=f.k==="many"?{n:f.n}:f.k==="group"?{names:f.names.join(lang==="hi"?" और ":" and "),g:cls(f.g)}:{names:f.names.join(lang==="hi"?" और ":" and "),i:f.i};return t(f.k,o)}
function render(){const o=$("out");
  if(view.k==="empty"){$("rTitle").textContent=t("rEmpty");o.innerHTML=`<div class="empty"><div class="spark">✦</div><b>${t("emptyT")}</b><span>${t("emptyS")}</span></div>`;return}
  $("rTitle").textContent=t("rTitle");
  if(view.k==="msg"){o.innerHTML=`<div class="empty">${esc(t(view.m,view.p))}</div>`;return}
  const d=view.d,tt=d.totals;
  const flags=d.flags.map(f=>`<div class="flag">${esc(flag(f))}</div>`).concat(d.unmatched.length?[`<div class="flag bad">${esc(t("unm",{names:d.unmatched.join(", ")}))}</div>`]:[]).join("");
  const cards=d.medicines.map(m=>{const ex=m.explanation;
    const alts=m.alternatives.map((a,i)=>`<div class="alt ${i?"":"best"}"><div>${esc(a.name)}<small>${esc(a.manufacturer)} · ${esc(pk(a.packaging))}${i?"":" · "+t("best")}</small></div><div>${rs(a.price)}</div><div class="s">${a.savePct>0?t("save",{n:a.savePct}):t("sim")}</div></div>`).join("");
    return `<article class="med"><div class="mh"><div><h3>${esc(m.name)}</h3><div class="gen">${esc(m.ingredients)}</div><span class="badge">${esc(cls(m.therapeuticClass))}</span>${m.discontinued?`<span class="badge">${t("disc")}</span>`:""}</div><div class="price">${rs(m.price)}<small>${esc(pk(m.packaging))}</small></div></div>
    ${ex?`<div class="ai"><span class="badge">${t(ex.source==="ai"?"aiB":"refB")}</span><p>${esc(lang==="hi"?ex.hi:ex.en)}</p></div>`:""}
    <p style="color:var(--mu);font-size:.95rem">${esc(t("made",{m:m.manufacturer}))}</p><div class="alts">${alts||`<div class="note">${t("noAlt")}</div>`}</div></article>`}).join("");
  o.innerHTML=`<div class="stats"><div class="stat"><b class="big">${d.medicines.length}</b><span>${t("s1")}</span></div><div class="stat"><b class="big">${rs(tt.brand)}</b><span>${t("s2")}</span></div><div class="stat s"><b class="big">${rs(tt.saving)}</b><span>${t("s3")}</span></div></div>${flags}${cards}${nextLinks(d)}`}
function nextLinks(d){const q=d.historyId?"?h="+encodeURIComponent(d.historyId):"";return `<div class="next"><a class="btn p" href="/schedule.html${q}">${t("nxSc")}</a><a class="btn" href="/pharmacies.html">${t("nxPh")}</a><a class="btn" href="/history.html">${t("nxHi")}</a>${d.historyId?`<a class="btn" href="/report.html?h=${encodeURIComponent(d.historyId)}">${t("nxRep")}</a>`:""}</div>`}
function applyLang(){document.documentElement.lang=lang;
  document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));
  $("sq").placeholder=t("sq");$("txt").placeholder=t("ph");
  setNote(note?note.k:"nDefault",note&&note.p);if(!note)$("ocrNote").hidden=false;ocrExtra();render()}
CS.onLang(l=>{lang=l;applyLang()});
const sync=()=>{$("go").disabled=!($("verified").checked&&$("txt").value.trim())};
$("txt").oninput=sync;$("verified").onchange=sync;
async function decode(){
  if(!$("txt").value.trim()){view={k:"msg",m:"noTxt"};render();return}
  view={k:"msg",m:"decoding"};render();
  try{const r=await fetch("/api/decode",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:$("txt").value})});
    if(r.status===401){location.replace("/auth.html");return}if(!r.ok)throw new Error((await r.json()).error||r.status);const d=await r.json();
    view=(!d.medicines.length&&!d.unmatched.length)?{k:"msg",m:"noMed"}:{k:"data",d}}

async function prep(file,mode){
  const b=await loadBitmap(file),q=rot%2===1,bw=q?b.height:b.width,bh=q?b.width:b.height,sc=Math.max(.3,Math.min(2.5,2200/Math.max(bw,bh))),w=Math.round(bw*sc),h=Math.round(bh*sc);

const PFX2=/^(\d+\s*[.)]?\s*)?(tb|tabs?|tablet|caps?|capsule|syp|sy|syrup|inj|susp|cream|gel|oint|drops)\b\.?\s+(?=\S)/i;

const DIRS=/^\W*(for|x|twice|thrice|once|daily|after|before|with|at|in|every|if|sos|tds|bd|od|hs|qid|morning|night|\d\s*-\s*\d\s*-\s*\d|\d+\s*(days?|weeks?))\b/i;
