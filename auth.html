<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CuraSight — Sign in</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Hind:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#04070d;--card:rgba(10,15,24,.9);--ln:#1b2432;--tx:#f2f6fc;--mu:#a3afc0;--bl:#0a63ff;--bl2:#5b9dff;--bad:#ff7b8a;box-sizing:border-box}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font:16px/1.6 Hind,system-ui,sans-serif;display:grid;place-items:center;padding:24px}body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 50% 20%,rgba(10,99,255,.18),transparent 40%),linear-gradient(180deg,#07101f,#04070d 70%)}.shell{width:min(460px,100%)}.brand{text-align:center;margin-bottom:26px}.brand b{font:400 2.3rem 'Archivo Black',sans-serif}.brand span{display:block;color:var(--mu);margin-top:4px}.card{background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:30px;box-shadow:0 20px 70px rgba(0,0,0,.35)}h1{font:400 1.8rem 'Archivo Black',sans-serif;margin:0 0 8px}p.sub{color:var(--mu);margin:0 0 24px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:22px}.tabs button{padding:11px;border:1px solid var(--ln);border-radius:10px;background:#070c14;color:var(--mu);font:600 1rem Hind;cursor:pointer}.tabs button.on{background:var(--bl);border-color:var(--bl);color:#fff}label{display:block;margin:14px 0 7px;font-weight:600}input{width:100%;padding:13px 14px;border-radius:10px;border:1px solid var(--ln);background:#04070d;color:var(--tx);font:1rem Hind}input:focus{outline:2px solid var(--bl2);outline-offset:1px}.primary{width:100%;margin-top:22px;padding:14px;border:0;border-radius:10px;background:var(--bl);color:#fff;font:600 1rem Hind;cursor:pointer}.primary:disabled{opacity:.5;cursor:not-allowed}.error{display:none;margin-top:14px;border:1px solid rgba(255,123,138,.4);background:rgba(255,123,138,.08);color:#ffd7dc;border-radius:10px;padding:11px 13px}.foot{color:var(--mu);font-size:.85rem;text-align:center;margin-top:18px}.switch{text-align:center;margin:18px 0 0;color:var(--mu)}.switch button{background:none;border:0;color:var(--bl2);cursor:pointer;font:600 1rem Hind}
</style></head>
<body><main class="shell"><div class="brand"><b>CuraSight</b><span>Private prescription history, built for you.</span></div><section class="card"><div class="tabs"><button id="loginTab" class="on">Log in</button><button id="signupTab">Sign up</button></div><h1 id="title">Welcome back</h1><p class="sub" id="subtitle">Log in to access your prescription workspace and history.</p><form id="form"><div id="nameWrap" hidden><label for="name">Full name</label><input id="name" autocomplete="name"></div><label for="email">Email</label><input id="email" type="email" autocomplete="email" required><label for="password">Password</label><input id="password" type="password" minlength="8" autocomplete="current-password" required><div id="confirmWrap" hidden><label for="confirm">Confirm password</label><input id="confirm" type="password" minlength="8" autocomplete="new-password"></div><button class="primary" id="submit">Log in</button><div class="error" id="error"></div></form><div class="switch"><span id="switchText">New to CuraSight?</span> <button type="button" id="switchBtn">Create an account</button></div></section><div class="foot">Your prescription history is tied to your account and is not shared between users.</div></main>
<script>
const $=id=>document.getElementById(id);let mode=new URLSearchParams(location.search).get('mode')==='signup'?'signup':'login';
function render(){const signup=mode==='signup';$('loginTab').classList.toggle('on',!signup);$('signupTab').classList.toggle('on',signup);$('nameWrap').hidden=!signup;$('confirmWrap').hidden=!signup;$('name').required=signup;$('confirm').required=signup;$('title').textContent=signup?'Create your account':'Welcome back';$('subtitle').textContent=signup?'Sign up to save every decoded prescription to your private history.':'Log in to access your prescription workspace and history.';$('submit').textContent=signup?'Sign up':'Log in';$('switchText').textContent=signup?'Already have an account?':'New to CuraSight?';$('switchBtn').textContent=signup?'Log in':'Create an account';$('password').autocomplete=signup?'new-password':'current-password';$('error').style.display='none'}
$('loginTab').onclick=()=>{mode='login';history.replaceState({},'', '?mode=login');render()};$('signupTab').onclick=()=>{mode='signup';history.replaceState({},'', '?mode=signup');render()};$('switchBtn').onclick=()=>{mode=mode==='signup'?'login':'signup';history.replaceState({},'', '?mode='+mode);render()};
$('form').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;$('error').style.display='none';if(mode==='signup'&&$('password').value!==$('confirm').value){$('error').textContent='Passwords do not match.';$('error').style.display='block';$('submit').disabled=false;return}const endpoint=mode==='signup'?'/api/signup':'/api/login';const body={email:$('email').value,password:$('password').value};if(mode==='signup')body.name=$('name').value;try{const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw new Error(data.error||'Something went wrong.');location.replace('/')}catch(err){$('error').textContent=err.message;$('error').style.display='block';$('submit').disabled=false}};
render();fetch('/api/me',{credentials:'same-origin'}).then(r=>r.json()).then(x=>{if(x.authenticated)location.replace('/')}).catch(()=>{});
</script></body></html>
